<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transmission Web Control - 移动版</title>
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233b82f6'/%3E%3Cpath d='M16 48V24l8-8h16l8 8v24a4 4 0 01-4 4H20a4 4 0 01-4-4z' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='34' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M32 28v4' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
    <div class="m-loading" id="m-loading">
        <div class="m-spinner"></div>
        <div style="margin-top:12px;font-size:13px;color:var(--text-muted)">正在连接...</div>
    </div>

    <script src="js/vendor/lodash.min.js"></script>
    <script src="js/vendor/idb.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db-cache.js"></script>
    <script src="js/lang/zh-CN.js"></script>
    <script src="js/lang/en.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/legacy/rpc-legacy-adapter.js"></script>
    <script src="js/rpc.js"></script>
    <script src="js/theme.js"></script>
    <script>
    document.addEventListener('alpine:init', function() {
        Alpine.store('theme', {
            mode: TWC.theme.getTheme(),
            toggle: function() {
                TWC.theme.toggle();
                this.mode = TWC.theme.getTheme();
            }
        });
    });
    </script>
    <script src="js/vendor/alpinejs.min.js" defer></script>
    <script src="js/ui-history.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/mobile-views.js"></script>
    <script>
    (function() {
        var rpcUrl = '/transmission/rpc';
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('rpc')) {
            rpcUrl = urlParams.get('rpc');
        }

        TWC.rpc.setConfig(rpcUrl);

        TWC.rpc.testConnection(function(success, data) {
            if (success) {
                TWC.rpc.getSession(null, function(sessionData, sessionSuccess) {
                    if (sessionSuccess) {
                        $('#m-loading').fadeOut(200, function() { $(this).remove(); });
                        TWC.mobile.init();
                    } else {
                        _showLogin();
                    }
                });
            } else {
                _showLogin();
            }
        });

        function _showLogin() {
            $('#m-loading').remove();
            var html = '<div class="m-login">' +
                '<h2>Transmission</h2>' +
                '<p style="font-size:12px;color:var(--text-muted);margin-bottom:20px">请输入连接信息</p>' +
                '<div class="m-form-group">' +
                '<label>RPC 地址</label>' +
                '<input type="text" id="m-login-url" value="' + TWC.utils.escapeHtml(rpcUrl) + '" />' +
                '</div>' +
                '<div class="m-form-group">' +
                '<label>用户名</label>' +
                '<input type="text" id="m-login-username" placeholder="可选" />' +
                '</div>' +
                '<div class="m-form-group">' +
                '<label>密码</label>' +
                '<input type="password" id="m-login-password" placeholder="可选" />' +
                '</div>' +
                '<div id="m-login-error" style="color:var(--color-danger-500);font-size:12px;margin-bottom:8px;display:none"></div>' +
                '<button class="m-btn primary" id="m-login-submit" style="width:100%">连接</button>' +
                '</div>';
            $('body').html(html);

            $('#m-login-submit').on('click', function() {
                var url = $('#m-login-url').val().trim();
                var username = $('#m-login-username').val().trim();
                var password = $('#m-login-password').val();

                TWC.rpc.setConfig(url, username, password);
                $('#m-login-error').hide();

                TWC.rpc.testConnection(function(success2) {
                    if (success2) {
                        TWC.mobile.init();
                    } else {
                        $('#m-login-error').text('连接失败，请检查地址和认证信息').show();
                    }
                });
            });

            $('#m-login-password').on('keydown', function(e) {
                if (e.key === 'Enter') $('#m-login-submit').click();
            });
        }
    })();
    </script>
</body>
</html>
