name: Manual Release

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Publish as prerelease?'
        required: false
        default: 'false'

jobs:
  build-and-release:
    name: Build and release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Package dist output
        run: |
          zip -r "trwm-${{ github.event.inputs.version }}.zip" dist

      - name: Create GitHub release and upload asset
        run: |
          set -euo pipefail
          tag="v${{ github.event.inputs.version }}"
          asset="trwm-${{ github.event.inputs.version }}.zip"
          body=$(python3 - <<'PY'
            import os
            print(f"Release version {os.environ['TAG']}\n\nBuilt from commit {os.environ['GITHUB_SHA']}.")
            PY
          )
          prerelease="${{ github.event.inputs.prerelease }}"
          payload=$(python3 - <<'PY'
            import json, os
            print(json.dumps({
              "tag_name": os.environ["TAG"],
              "name": os.environ["TAG"],
              "body": os.environ["BODY"],
              "draft": False,
              "prerelease": os.environ["PRERELEASE"].lower() == "true"
            }))
            PY
          )
          response=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          upload_url=$(printf '%s' "$response" | python3 - <<'PY'
            import json, sys
            obj = json.load(sys.stdin)
            print(obj["upload_url"].split("{")[0])
            PY
          )
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/zip" \
            --data-binary @"$asset" "${upload_url}?name=$asset"
        env:
          TAG: "v${{ github.event.inputs.version }}"
          BODY: |
            Release version v${{ github.event.inputs.version }}

            Built from commit ${{ github.sha }}.
          PRERELEASE: ${{ github.event.inputs.prerelease }}
